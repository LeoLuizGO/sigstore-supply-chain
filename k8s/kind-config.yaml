# Cluster kind de um nó só (control-plane), suficiente para o Kyverno e a app de exemplo.
# O nome do cluster vem de config.env (CLUSTER=sigstore) via `kind create cluster --name`.
#
# Imagem do node fixada por digest, como pede o release do kind v0.33.0:
#   kindest/node:v1.35.8 é uma das imagens pré-construídas desse release, e o Kubernetes 1.35
#   está dentro da faixa suportada pelo Kyverno 1.19 (v1.33–v1.36, página "Releases" do Kyverno).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
