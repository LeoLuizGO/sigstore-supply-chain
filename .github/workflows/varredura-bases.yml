# E4 — CVEs em três imagens base (varredura separada, NÃO bloqueante).
#
# Trivy 0.69.3 em python:3.12, python:3.12-slim e gcr.io/distroless/python3-debian12,
# cada uma fixada por digest (valores de 21/11/2026), com e sem --ignore-unfixed.
# Artifact "e4-cves-imagens-base":
#   e4-cves-imagens-base.csv              todas as CVEs (formato da ESPEC)
#   e4-cves-imagens-base-corrigiveis.csv  só as que têm correção (--ignore-unfixed), mesmo formato
#   json/<imagem>-{todas,corrigiveis}.json relatórios completos do Trivy
name: varredura-bases

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  COSIGN_VERSAO: v2.6.5

jobs:
  varredura:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar cosign (verificado pelo cosign-installer)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSAO }}

      - name: Instalar Trivy (versão fixa, hash e assinatura conferidos)
        run: bash scripts/ci/instalar-ferramentas-ci.sh trivy

      - name: Etapa - Varredura das imagens base
        run: |
          # arquivo|rótulo no CSV|referência fixada (tag + digest do índice multi-arquitetura)
          imagens=(
            "python-3.12|python:3.12|python:3.12.16-trixie@sha256:5411fa1b302c43f510324381162b5f5d0d93b9ee2af538f09d944f0d290ee3cb"
            "python-3.12-slim|python:3.12-slim|python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
            "distroless-python3-debian12|gcr.io/distroless/python3-debian12|gcr.io/distroless/python3-debian12:latest@sha256:2fdb05402a2cf21cf78fdb3ba4c5db167241e9e498140f5bf689d7efb773731f"
          )
          mkdir -p e4/json
          todas=()
          corrigiveis=()
          for item in "${imagens[@]}"; do
            IFS='|' read -r nome rotulo ref <<< "$item"
            echo "== ${ref}"
            trivy image --image-src remote --platform linux/amd64 --scanners vuln \
              --format json --output "e4/json/${nome}-todas.json" "$ref"
            trivy image --image-src remote --platform linux/amd64 --scanners vuln --skip-db-update \
              --ignore-unfixed --format json --output "e4/json/${nome}-corrigiveis.json" "$ref"
            todas+=("${rotulo}=e4/json/${nome}-todas.json")
            corrigiveis+=("${rotulo}=e4/json/${nome}-corrigiveis.json")
          done
          python3 scripts/ci/contar-cves.py e4/e4-cves-imagens-base.csv "${todas[@]}"
          python3 scripts/ci/contar-cves.py e4/e4-cves-imagens-base-corrigiveis.csv "${corrigiveis[@]}"
          trivy --version > e4/trivy-versao.txt
          {
            echo "## E4 - CVEs nas imagens base (Trivy 0.69.3)"
            echo
            echo "### Todas (sem --ignore-unfixed)"
            echo '```'
            cat e4/e4-cves-imagens-base.csv
            echo '```'
            echo "### Só com correção disponível (--ignore-unfixed)"
            echo '```'
            cat e4/e4-cves-imagens-base-corrigiveis.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e4-cves-imagens-base
          path: e4/
          if-no-files-found: warn
