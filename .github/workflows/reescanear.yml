# Reescaneamento periódico (mitigação do rollback, cenário E2.5).
#
# Roda o Trivy de novo num digest já publicado, com a mesma regra bloqueante do pipeline
# (CRITICAL com correção disponível). Se passar, grava um atestado vuln novo
# (cosign attest --replace --type vuln), com metadata.scanFinishedOn atual, que substitui o
# atestado vuln anterior do mesmo digest. Se não passar, NÃO atesta: o atestado antigo envelhece,
# sai da janela (JANELA_VARREDURA em config.env) e o Kyverno passa a recusar a versão.
#
# Este workflow nunca assina a imagem: só atesta (identidade ...reescanear.yml@refs/heads/main).
# Também só atesta digests que já têm assinatura válida do pipeline.yml.
name: reescanear

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest a reescanear (sha256:...). Vazio = digest atual de :main"
        type: string
        default: ""
  schedule:
    # Diário, 06:17 UTC (03:17 em Brasília). O GitHub desativa agendamentos de repositórios
    # públicos sem atividade por 60 dias.
    - cron: "17 6 * * *"

permissions: {}

concurrency:
  group: reescanear
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COSIGN_VERSAO: v2.6.5
  EMISSOR_OIDC: https://token.actions.githubusercontent.com

jobs:
  reescanear:
    # A identidade aceita pelo cluster é ...reescanear.yml@refs/heads/main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # token OIDC para o Fulcio (atestado keyless)
      packages: write # grava o atestado (.att) no GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar cosign (verificado pelo cosign-installer)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSAO }}

      - name: Instalar Trivy e crane (versões fixas, hash e assinatura conferidos)
        run: bash scripts/ci/instalar-ferramentas-ci.sh trivy crane

      - name: Login no GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolver digest
        id: alvo
        env:
          DIGEST_ENTRADA: ${{ inputs.digest }}
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${DIGEST_ENTRADA:-}" ]; then
            digest="$DIGEST_ENTRADA"
          else
            digest=$(crane digest "${imagem}:main")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest inválido: ${digest}"; exit 1; }
          echo "imagem=${imagem}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Alvo: ${imagem}@${digest}"

      - name: Exigir assinatura do pipeline
        env:
          REF: ${{ steps.alvo.outputs.imagem }}@${{ steps.alvo.outputs.digest }}
        run: |
          # Só reatesta o que o pipeline assinou: evita dar atestado novo a uma imagem adulterada
          # que esteja em :main (por exemplo, depois do cenário E2.2).
          id_pipeline="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/pipeline.yml@refs/heads/main"
          if ! cosign verify --certificate-identity "$id_pipeline" --certificate-oidc-issuer "$EMISSOR_OIDC" \
               "$REF" > assinatura.json 2> assinatura.txt; then
            cat assinatura.txt
            echo "::error::${REF} não tem assinatura válida do pipeline.yml; nada será atestado"
            exit 1
          fi
          echo "assinatura do pipeline conferida"

      - name: Etapa - Trivy bloqueante (CRITICAL com correção)
        env:
          REF: ${{ steps.alvo.outputs.imagem }}@${{ steps.alvo.outputs.digest }}
        run: |
          status=0
          trivy image --image-src remote --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format json --output reescan-trivy-bloqueante.json "$REF" || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "## Reescaneamento reprovado: atestado NÃO renovado"
              echo
              echo "\`${REF}\` tem CVE CRITICAL com correção (ou o Trivy falhou). O atestado vuln anterior"
              echo "não foi substituído e vai sair da janela de validade; depois disso o Kyverno recusa esta versão."
              echo
              echo "| CVE | Pacote | Instalada | Corrigida em |"
              echo "|---|---|---|---|"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) |"' \
                reescan-trivy-bloqueante.json 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::reescaneamento reprovado; nenhum atestado gerado"
            exit "$status"
          fi

      - name: Etapa - Relatório cosign-vuln (Trivy)
        env:
          REF: ${{ steps.alvo.outputs.imagem }}@${{ steps.alvo.outputs.digest }}
        run: |
          trivy image --image-src remote --scanners vuln --skip-db-update \
            --format cosign-vuln --output reescan-vuln.json "$REF"
          jq '{scanFinishedOn: .metadata.scanFinishedOn,
               vulnerabilidades: ([.scanner.result.Results[]?.Vulnerabilities[]?] | length)}' reescan-vuln.json

      - name: Etapa - Novo atestado vuln (cosign attest --replace)
        env:
          REF: ${{ steps.alvo.outputs.imagem }}@${{ steps.alvo.outputs.digest }}
        run: |
          # --replace remove do manifesto sha256-<hex>.att as camadas cujo predicateType é o mesmo
          # (https://cosign.sigstore.dev/attestation/vuln/v1) e acrescenta o novo; SBOM e
          # proveniência continuam lá. A assinatura (.sig) não é tocada.
          cosign attest --yes --replace --type vuln --predicate reescan-vuln.json "$REF" 2>&1 \
            | tee reescan-cosign-attest.txt

      - name: Conferir o atestado novo
        env:
          REF: ${{ steps.alvo.outputs.imagem }}@${{ steps.alvo.outputs.digest }}
        run: |
          id_reescanear="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/reescanear.yml@refs/heads/main"
          cosign verify-attestation --type vuln \
            --certificate-identity "$id_reescanear" --certificate-oidc-issuer "$EMISSOR_OIDC" \
            "$REF" > reescan-verify-attestation.json
          fim=$(jq -r '.payload' reescan-verify-attestation.json | tail -n1 | base64 -d | jq -r '.predicate.metadata.scanFinishedOn')
          {
            echo "## Reescaneamento aprovado"
            echo
            echo "- Digest: \`${REF}\`"
            echo "- Novo atestado vuln com scanFinishedOn = ${fim}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reescaneamento
          path: reescan-*
          if-no-files-found: ignore
